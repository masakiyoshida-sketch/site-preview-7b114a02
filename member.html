<!DOCTYPE html>
<!-- 会員ページの入れ物（2026-10-28）。
     保護者の会員ページ（GAS: .company/sites/sports-school/scripts/parent-portal）を画面いっぱいに埋め込む。
     script.google.com を直接開くと上に「Google Apps Script のユーザーによって作成されたもの」の青い帯が出るが、
     埋め込むと出ない。アドレスも nposa.jp のままになる。
     パスワード設定メールのリンク（?setup=…）は、そのまま中の会員ページへ渡す。 -->
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>会員ページ｜NPO法人スポーツアシスタント</title>
<link rel="icon" type="image/png" href="assets/logo-square.png">
<style>
  html, body { margin: 0; height: 100%; background: #eef3fb; }
  #portal { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; z-index: 1; }
  /* 会員ページが出るまで5〜8秒かかるので、その間は後ろにこれを見せる（会員ページが描かれると上に重なって隠れる） */
  .loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 14px; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; color: #475569; font-size: 15px; }
  .loading::before { content: ""; width: 34px; height: 34px; border-radius: 50%; border: 4px solid #cbd8ee;
                     border-top-color: #2563eb; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fallback { font-family: sans-serif; text-align: center; padding: 40px 16px; color: #333; }
  .fallback a { color: #2563eb; }
</style>
</head>
<body>
<div style="position:sticky;top:0;z-index:99;background:#c2410c;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px 10px;font-family:sans-serif">確認用プレビューです（公開前・URLは口外しないでください）</div>
<div class="loading" aria-live="polite">会員ページを読み込んでいます…</div>
<iframe id="portal" title="会員ページ"></iframe>
<noscript>
  <p class="fallback">会員ページを表示するには JavaScript を有効にしてください。<br>
  <a href="https://script.google.com/macros/s/AKfycbwR6AdkdpmtLl__PPtfDhx-DasNXH3Pw5-d_2M8Z6Q1D0b0eIpLdHbPJKjlBfX4MFVU/exec">会員ページを直接開く</a></p>
</noscript>
<script>
  // 保護者ページ（GAS）の公開URL。デプロイIDは更新しても変わらない
  var PORTAL = 'https://script.google.com/macros/s/AKfycbwR6AdkdpmtLl__PPtfDhx-DasNXH3Pw5-d_2M8Z6Q1D0b0eIpLdHbPJKjlBfX4MFVU/exec';
  // 渡すのはパスワード設定の印（setup）だけ
  var setup = new URLSearchParams(location.search).get('setup');
  document.getElementById('portal').src = PORTAL + (setup ? '?setup=' + encodeURIComponent(setup) : '');
</script>
</body>
</html>
